name: Test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full:
    name: Node.js Latest Full
    runs-on: ubuntu-latest
    steps:
      - name: Configure npm time machine registry
        run: npm config set registry https://:2024-09-14T14%3A37%3A54.761000Z@time-machines-npm.sealsecurity.io/
      - name: Checkout the repository
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --ignore-scripts
      - name: Pack the release tarball
        run: |
          ./node_modules/.bin/clean-publish --without-publish --temp-dir "$RUNNER_TEMP/publish"
          cd "$RUNNER_TEMP/publish"
          npm pack --ignore-scripts
      - name: Upload the release tarball
        uses: actions/upload-artifact@v4
        with:
          name: npm-tarball
          path: ${{ runner.temp }}/publish/postcss-8.4.47.tgz
          if-no-files-found: error
      - name: Run tests
        run: pnpm test
    timeout-minutes: 40
  short:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version:
          - 20
          - 18
    name: Node.js ${{ matrix.node-version }} Quick
    steps:
      - name: Configure npm time machine registry
        run: npm config set registry https://:2024-09-14T14%3A37%3A54.761000Z@time-machines-npm.sealsecurity.io/
      - name: Checkout the repository
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Install Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --ignore-scripts
      - name: Run unit tests
        run: pnpm run unit
    timeout-minutes: 40
  old:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version:
          - 16
          - 14
          - 12
          - 10
    name: Node.js ${{ matrix.node-version }} Quick
    steps:
      - name: Configure npm time machine registry
        run: npm config set registry https://:2024-09-14T14%3A37%3A54.761000Z@time-machines-npm.sealsecurity.io/
      - name: Checkout the repository
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 3
        env:
          ACTIONS_ALLOW_UNSECURE_COMMANDS: true
      - name: Install Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        run: pnpm install --ignore-scripts
      - name: Downgrade TypeScript
        run: pnpm install typescript@4
      - name: Run unit tests
        run: pnpm run old
    timeout-minutes: 40
  windows:
    runs-on: windows-latest
    name: Windows Quick
    steps:
      - name: Configure npm time machine registry
        run: npm config set registry https://:2024-09-14T14%3A37%3A54.761000Z@time-machines-npm.sealsecurity.io/
      - name: Checkout the repository
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Install Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --ignore-scripts
      - name: Run unit tests
        run: pnpm run unit
    timeout-minutes: 40
